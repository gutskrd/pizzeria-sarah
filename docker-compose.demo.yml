# Local demo database only (used by `npm run demo`). Not for production:
# the password below is a fixed demo value and the port is bound to this computer.
services:
  demo-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: pizzeria_sarah_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - '127.0.0.1:${DEMO_DB_PORT:-5433}:5432'
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d pizzeria_sarah_demo']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  demo-db-data:
